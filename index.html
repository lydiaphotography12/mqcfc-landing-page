<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Continue</title>

    <!-- Cloudflare Turnstile -->
    <script
        src="https://challenges.cloudflare.com/turnstile/v0/api.js"
        async
        defer>
    </script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, Helvetica, sans-serif;

            background: #f5f5f5;
            color: #111;
        }

        .container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .box {
            background: white;

            padding: 40px 30px;

            border-radius: 12px;

            text-align: center;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        .logo {
            display: block;

            width: 140px;
            max-width: 70%;
            height: auto;

            margin: 0 auto 25px;
        }

        h1 {
            margin: 0 0 10px;

            font-size: 28px;
            font-weight: 600;
        }

        p {
            margin: 0 0 25px;

            font-size: 15px;
            line-height: 1.5;

            color: #666;
        }

        .captcha {
            display: flex;
            justify-content: center;

            margin-bottom: 25px;
        }

        .continue-button {
            width: 100%;

            padding: 13px 20px;

            border: none;
            border-radius: 6px;

            background: #111;
            color: white;

            font-size: 16px;
            font-weight: 600;

            cursor: pointer;

            transition: opacity 0.2s ease,
                        transform 0.2s ease;
        }

        .continue-button:hover:not(:disabled) {
            opacity: 0.85;
            transform: translateY(-1px);
        }

        .continue-button:disabled {
            background: #ccc;
            color: #888;

            cursor: not-allowed;
        }

        .status {
            min-height: 20px;

            margin-top: 15px;

            font-size: 13px;
            color: #666;
        }

        @media (max-width: 480px) {
            .box {
                padding: 30px 20px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="box">

            <!-- LOGO -->
            <img
                src="Logo.jpg"
                alt="Logo"
                class="logo">

            <h1>Continue</h1>

            <p>
                Please complete the CAPTCHA below to continue.
            </p>

            <!-- CLOUDFLARE TURNSTILE -->
            <div class="captcha">

                <div
                    class="cf-turnstile"
                    data-sitekey="0x4AAAAAAFMB9TexrDEPxSNS"
                    data-callback="captchaComplete"
                    data-expired-callback="captchaExpired"
                    data-error-callback="captchaError">
                </div>

            </div>

            <!-- CONTINUE BUTTON -->
            <button
                id="continueButton"
                class="continue-button"
                type="button"
                disabled
                onclick="continueToPage()">

                Continue

            </button>

            <div
                id="status"
                class="status">
            </div>

        </div>

    </div>


    <script>

        let captchaPassed = false;


        // CAPTCHA completed successfully
        function captchaComplete(token) {

            captchaPassed = true;

            const button =
                document.getElementById("continueButton");

            const status =
                document.getElementById("status");

            button.disabled = false;

            status.textContent =
                "CAPTCHA completed. You can continue.";
        }


        // CAPTCHA expired
        function captchaExpired() {

            captchaPassed = false;

            const button =
                document.getElementById("continueButton");

            const status =
                document.getElementById("status");

            button.disabled = true;

            status.textContent =
                "CAPTCHA expired. Please complete it again.";
        }


        // CAPTCHA error
        function captchaError() {

            captchaPassed = false;

            const button =
                document.getElementById("continueButton");

            const status =
                document.getElementById("status");

            button.disabled = true;

            status.textContent =
                "There was a CAPTCHA error. Please try again.";
        }


        // Continue to destination
        function continueToPage() {

            if (!captchaPassed) {
                return;
            }

            window.location.href =
                "https://bit.ly/manchesterqueerfashioncreativeswhatsappgroup";

        }

    </script>

</body>
</html>
