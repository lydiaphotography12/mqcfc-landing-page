<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Continue</title>

    <!-- Cloudflare Turnstile -->
    <script
        src="https://challenges.cloudflare.com/turnstile/v0/api.js"
        async
        defer>
    </script>

    <style>

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: Arial, sans-serif;

            background: #111;
            color: white;
        }

        .box {
            width: 90%;
            max-width: 450px;

            padding: 40px;

            text-align: center;

            background: #222;

            border-radius: 12px;
        }

        h1 {
            margin-top: 0;
        }

        p {
            color: #ccc;
            line-height: 1.5;
        }

        .captcha {
            margin: 30px 0;
            display: flex;
            justify-content: center;
        }

        button {
            width: 100%;

            padding: 14px;

            border: none;
            border-radius: 6px;

            background: white;
            color: black;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

    </style>

</head>


<body>

<div class="captcha">

        <div
            class="cf-turnstile"
            data-sitekey="0x4AAAAAAFMB9TexrDEPxSNS"
            data-callback="captchaComplete">
        </div>

    </div>

    <button
        id="continueButton"
        disabled
        onclick="continueToPage()">

        Continue

    </button>

</div>

    <p>
        Please complete the verification below
        before continuing.
    </p>

 <div class="captcha">

        <div
            class="cf-turnstile"
            data-sitekey="YOUR_SITE_KEY"
            data-callback="captchaComplete">
        </div>

    </div>
    
<button
        id="continueButton"
        disabled
        onclick="continueToPage()">

        Continue
</div>


<script>

    let captchaPassed = false;


    function captchaComplete(token) {

        captchaPassed = true;

        document.getElementById(
            "continueButton"
        ).disabled = false;

    }


    function continueToPage() {

        if (!captchaPassed) {
            return;
        }

        window.location.href =
            "ttps://bit.ly/manchesterqueerfashioncreativeswhatsappgroup";

    }

</script>

</body>

</html>
