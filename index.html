<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Your Organisation</title>

    <!-- Cap -->
    <script
        src="https://cdn.jsdelivr.net/npm/@cap.js/widget@0.1.30"
        async>
    </script>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
        }

        .container {
            max-width: 700px;
            margin: auto;
            padding: 60px 20px;
        }

        h1 {
            font-size: 60px;
        }

        form {
            background: white;
            color: black;
            padding: 30px;
            border-radius: 10px;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            margin: 8px 0 20px;
            box-sizing: border-box;
        }

        textarea {
            height: 120px;
        }

        button {
            width: 100%;
            padding: 14px;
            background: black;
            color: white;
            border: none;
            cursor: pointer;
        }

    </style>

</head>


<body>

<div class="container">

    <h1>Your Organisation</h1>

    <p>
        Welcome to our website.
    </p>


    <form method="POST"
          action="YOUR_FORM_ENDPOINT">

        <label>Name</label>

        <input
            type="text"
            name="name"
            required
        >


        <label>Email</label>

        <input
            type="email"
            name="email"
            required
        >


        <label>Message</label>

        <textarea
            name="message"
            required>
        </textarea>


        <!-- CAP CAPTCHA -->

        <cap-widget
            id="cap"
            data-cap-api-endpoint="https://YOUR-CAP-SERVER/">
        </cap-widget>


        <br>

        <button type="submit">
            Send Message
        </button>

    </form>

</div>

</body>

</html>
